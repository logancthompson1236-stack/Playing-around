name: Mall Revival build

# Every push that touches the game builds both test versions:
#   - the single-file HTML, published to GitHub Pages under /mall/ (latest) and /mall/vX.Y.Z/
#   - the privacy policy (for Google Play), at /mall/privacy.html
#   - the APK, attached to a GitHub Release tagged mall-vX.Y.Z
on:
  push:
    paths:
      - 'mall/**'
      - '.github/workflows/mall-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mall-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mall/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web game
        working-directory: mall/web
        run: |
          npm ci
          npm run build
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: mall/web
        run: |
          npx cap sync android
          cd ../android
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MallRevival-v${VERSION}.apk"
          cp ../web/dist/index.html "$GITHUB_WORKSPACE/MallRevival-v${VERSION}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: MallRevival-v${{ env.VERSION }}
          path: |
            MallRevival-v*.apk
            MallRevival-v*.html
          if-no-files-found: error

      - name: Publish HTML to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages "$remote" pages
          else
            mkdir pages && git -C pages init -b gh-pages && git -C pages remote add origin "$remote"
          fi
          mkdir -p "pages/mall/v${VERSION}"
          cp mall/web/dist/index.html pages/mall/index.html
          cp mall/web/dist/index.html "pages/mall/v${VERSION}/index.html"
          cp mall/web/dist/sw.js pages/mall/sw.js
          cp mall/web/dist/sw.js "pages/mall/v${VERSION}/sw.js"
          cp mall/web/privacy.html pages/mall/privacy.html
          touch pages/.nojekyll
          [ -f pages/index.html ] || printf '<!doctype html><meta http-equiv="refresh" content="0; url=mall/"><a href="mall/">Mall Revival</a>\n' > pages/index.html
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Mall Revival v${VERSION} (${GITHUB_SHA::7})"
          git push origin gh-pages

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mall-v${VERSION}"
          pages="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/mall/v${VERSION}/"
          notes="Test build of Mall Revival v${VERSION}.

          - Android: download MallRevival-v${VERSION}.apk below and open it on your phone.
          - iPhone or any browser: ${pages}

          Built from ${GITHUB_SHA::7}."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "MallRevival-v${VERSION}.apk" "MallRevival-v${VERSION}.html" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "MallRevival-v${VERSION}.apk" "MallRevival-v${VERSION}.html" \
              --target "$GITHUB_SHA" --prerelease --title "Mall Revival v${VERSION}" --notes "$notes"
          fi
