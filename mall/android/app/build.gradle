apply plugin: 'com.android.application'

// The version comes from the web game's package.json, so the APK and the HTML build always match.
def webPkg = new groovy.json.JsonSlurper().parse(file('../../web/package.json'))
def (vMajor, vMinor, vPatch) = webPkg.version.tokenize('.').collect { it.replaceAll(/[^0-9].*/, '') as int }

// The private Google Play upload key, if this machine has it: android/keystore.properties (never committed,
// see keystore/README.md) or the MALL_UPLOAD_* environment variables in CI. Without it, release builds keep the test key.
def uploadProps = new Properties()
def uploadPropsFile = rootProject.file('keystore.properties')
if (uploadPropsFile.exists()) uploadPropsFile.withInputStream { uploadProps.load(it) }
def upload = { String key, String env -> uploadProps.getProperty(key) ?: System.getenv(env) }
def uploadStore = upload('storeFile', 'MALL_UPLOAD_STORE_FILE')

android {
    namespace = "com.mallrevival.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mallrevival.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName webPkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // A fixed, committed test key (see keystore/README.md) so updates install over older builds.
        test {
            storeFile file('../keystore/mall-revival-test.jks')
            storePassword 'mallrevival'
            keyAlias 'mallrevival'
            keyPassword 'mallrevival'
        }
        if (uploadStore) {
            play {
                storeFile rootProject.file(uploadStore)
                storePassword upload('storePassword', 'MALL_UPLOAD_STORE_PASSWORD')
                keyAlias upload('keyAlias', 'MALL_UPLOAD_KEY_ALIAS')
                keyPassword upload('keyPassword', 'MALL_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            signingConfig uploadStore ? signingConfigs.play : signingConfigs.test
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
