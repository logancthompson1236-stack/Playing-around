:root{
  --ink:#3d2b35; --ink2:#76626c; --cream:#fffaf1; --paper:#fff5e4; --line:#e4d6bf;
  --pink:#e8577e; --pink2:#ff8fab; --teal:#3fb8af; --yellow:#ffd23f; --green:#4cc38a; --red:#ef476f; --plum:#2d2236;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--plum);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui > *{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
input[type=text]{font:600 15px var(--body);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:7px 10px;width:100%;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}

/* Generic pieces */
.btn{font:600 15px var(--display);letter-spacing:.01em;border:2px solid var(--ink);border-radius:999px;padding:8px 18px;background:var(--cream);box-shadow:0 3px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--pink);color:#fff}
.btn.go{background:var(--green);color:#fff}
.btn.small{font-size:13px;padding:5px 12px}
.btn:disabled{opacity:.45;box-shadow:none;transform:none}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,250,241,.95);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font:600 14px var(--display);box-shadow:0 2px 0 rgba(61,43,53,.35);white-space:nowrap}
.round{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--cream);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);padding:0}
.round svg{width:24px;height:24px}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.muted{color:var(--ink2)}
.stars{color:#f4a300;letter-spacing:1px;font-family:var(--body)}
.stars .off{color:#d9cfc0}

/* Top HUD */
.hud-top{position:absolute;top:calc(6px + var(--st));left:calc(8px + var(--sl));right:calc(8px + var(--sr));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud-top > *{pointer-events:auto}
.clock{flex-direction:column;align-items:stretch;gap:2px;padding:4px 12px 6px;border-radius:16px}
.clock .row{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.clock .day{font-size:12px;color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:#eadfcb;overflow:hidden;min-width:96px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff8fab);border-radius:3px}
.money{font-size:17px}
.money.up{animation:bump .3s}
.money.neg{color:var(--red)}
@keyframes bump{50%{transform:scale(1.12)}}
.lvl{position:relative}
.lvl .ring{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pink) calc(var(--p)*1turn),#eadfcb 0);margin:-2px -6px -2px 0}
.lvl .ring b{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--cream);font-size:12px}

/* Bottom controls */
.day-ctl{position:absolute;right:calc(10px + var(--sr));bottom:calc(10px + var(--sb));display:flex;gap:10px}
.speed-on{background:var(--yellow)}
.night-bar{position:absolute;left:calc(8px + var(--sl));right:calc(8px + var(--sr));bottom:calc(8px + var(--sb));display:flex;gap:8px;align-items:flex-end;pointer-events:none}
.night-bar > *{pointer-events:auto}
.placing .night-bar{display:none}
.night-bar .spacer{flex:1;pointer-events:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;padding:6px 0 4px;border:2px solid var(--ink);border-radius:14px;background:var(--cream);box-shadow:0 3px 0 var(--ink);font:600 11px var(--display)}
.tool svg{width:24px;height:24px}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.floor-nav{position:absolute;left:calc(8px + var(--sl));top:calc(58px + var(--st));display:flex;flex-direction:column;align-items:center;gap:4px;z-index:4}
.floor-btn{position:relative;width:46px;height:36px;border-radius:12px;border:2px solid var(--ink);background:var(--cream);box-shadow:0 3px 0 var(--ink);font:700 15px var(--display);color:var(--ink);padding:0}
.floor-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.floor-btn:disabled{opacity:.35;box-shadow:0 1px 0 var(--ink)}
.floor-btn .dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--cream)}
.floor-label{font:700 14px var(--display);color:var(--ink);background:rgba(255,250,241,.95);border:2px solid var(--ink);border-radius:999px;padding:1px 8px}
.tool .dot{position:absolute;margin:-4px 0 0 30px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--cream)}
.open-doors{font-size:17px;padding:10px 22px}

/* Side panel */
.panel{position:absolute;top:calc(8px + var(--st));bottom:calc(8px + var(--sb));right:calc(8px + var(--sr));width:min(380px,48vw);background:var(--cream);border:2px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 rgba(61,43,53,.35);display:flex;flex-direction:column;overflow:hidden;animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.panel header{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.panel header h2{flex:1;margin:0;font:700 18px var(--display)}
.panel .tabs{display:flex;gap:4px;padding:0 10px 6px;overflow-x:auto;scrollbar-width:none}
.panel .tabs::-webkit-scrollbar{display:none}
.panel .tabs button{flex:1 0 auto;white-space:nowrap;font:600 13px var(--display);border:2px solid var(--ink);border-radius:999px;padding:4px 6px;background:#fff}
.panel .tabs button[aria-selected="true"]{background:var(--ink);color:var(--cream)}
.panel .body{flex:1;overflow-y:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.x{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:#fff;font:700 16px var(--display);line-height:1;padding:0}
.item{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:7px 9px;text-align:left;width:100%}
.item.can{border-color:var(--ink)}
.item canvas{flex:none;width:44px;height:44px;border-radius:10px;background:var(--paper)}
.item .info{flex:1;min-width:0}
.item .name{font:600 15px var(--display);display:block}
.item .sub{font-size:12px;color:var(--ink2);display:block}
.item .price{font:600 14px var(--display);white-space:nowrap}
.item.locked{opacity:.55}
.item.locked .price{font-size:12px}
.section-label{font:600 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:4px 2px 0}
.staff-row{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:7px 9px}
.staff-row canvas{width:44px;height:44px;border-radius:10px;background:var(--paper);flex:none}
.staff-row select{font:600 13px var(--body);border:2px solid var(--ink);border-radius:8px;padding:3px 4px;background:#fff;max-width:130px}

/* Context card and placement bar */
.card{position:absolute;left:50%;bottom:calc(10px + var(--sb));transform:translateX(-50%);width:min(440px,calc(100vw - 180px));background:var(--cream);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(61,43,53,.35);padding:10px 12px;display:flex;flex-direction:column;gap:6px;animation:pop .15s ease-out}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
.card .top{display:flex;align-items:flex-start;gap:8px}
.card h3{margin:0;font:700 17px var(--display);flex:1}
.card p{margin:0;line-height:1.4;font-size:13px}
.card .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card .warn{color:#b3263e;font-weight:700}
.place-hint{position:absolute;top:calc(56px + var(--st));left:50%;transform:translateX(-50%);max-width:80vw;text-align:center}

/* Gus dialog, tips, toasts */
.dialog{position:absolute;left:calc(10px + var(--sl));right:calc(10px + var(--sr));bottom:calc(72px + var(--sb));margin:0 auto;max-width:620px;display:flex;align-items:flex-end;gap:10px;animation:pop2 .18s ease-out}
@keyframes pop2{from{transform:translateY(12px);opacity:0}}
.dialog .face{width:76px;height:76px;flex:none;border-radius:50%;background:#bfe7f7;border:2px solid var(--ink);overflow:hidden}
.dialog .face canvas{width:100%;height:100%}
.dialog .box{flex:1;background:var(--cream);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(61,43,53,.35);padding:10px 14px 8px}
.dialog .who{font:700 13px var(--display);color:var(--teal);text-transform:uppercase;letter-spacing:.06em}
.dialog .line{font:600 15px var(--body);line-height:1.4;min-height:2.6em;margin:2px 0 0}
.dialog .more{font:600 12px var(--display);color:var(--ink2);text-align:right}
.tip{position:absolute;left:calc(10px + var(--sl));bottom:calc(70px + var(--sb));width:min(290px,40vw);background:#fffbe8;border:2px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 rgba(61,43,53,.35);padding:7px 10px;animation:pop2 .2s ease-out;transform:rotate(-.6deg)}
.tip .t{font:700 13px var(--display);display:flex;gap:6px;align-items:center}
.tip p{margin:2px 0 5px;font-size:12.5px;line-height:1.35}
.tip .btn.small{font-size:12px;padding:4px 10px}
.tip .row{display:flex;gap:6px;justify-content:flex-end}
.toast{position:absolute;top:calc(58px + var(--st));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);font:600 14px var(--display);padding:7px 16px;border-radius:999px;animation:pop3 .2s ease-out;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@keyframes pop3{from{transform:translate(-50%,-8px);opacity:0}}

/* Modals */
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(29,20,36,.55);padding:calc(10px + var(--st)) calc(12px + var(--sr)) calc(10px + var(--sb)) calc(12px + var(--sl));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .sheet{background:var(--cream);border:2px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(61,43,53,.4);max-height:100%;overflow-y:auto;width:min(640px,100%);padding:14px 16px;touch-action:pan-y}
.modal h2{margin:0 0 6px;font:700 22px var(--display)}

/* Title */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding-bottom:calc(23vh + var(--sb));text-align:center;animation:fade .6s ease 1.6s both}
/* (Raised above the bottom of the screen, where phone browsers show their own notices, e.g. Chrome's "To exit full
   screen" when a page goes full screen on itch.io, which otherwise sits right on top of the buttons.) */
.title-scene{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;background:#24183f}
.title .btn{box-shadow:0 4px 0 var(--ink),0 0 18px rgba(255,200,120,.35)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{font:700 clamp(40px,10vh,76px) var(--display);color:var(--pink2);line-height:.95;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:.01em}
.logo small{display:block;font-size:.34em;color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:0 2px 0 var(--ink);margin-top:6px}
.title .buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.version{position:absolute;right:calc(12px + var(--sr));bottom:calc(8px + var(--sb));font:600 12px var(--display);color:rgba(255,250,241,.8)}

/* Intro */
.intro{position:absolute;inset:0;background:#1d1424;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(10px + var(--st)) calc(16px + var(--sr)) calc(10px + var(--sb)) calc(16px + var(--sl));color:var(--cream)}
.intro canvas{width:min(560px,80vw,calc((100vh - 120px) * 16 / 9));aspect-ratio:16/9;border-radius:16px;border:3px solid var(--cream);background:#2d2236}
.intro .cap{max-width:600px;text-align:center;font:600 16px var(--body);line-height:1.45;min-height:2.9em}
.intro .letter{width:min(520px,80vw);background:#fff8e7;color:#4a3646;border-radius:6px;padding:14px 22px;transform:rotate(-1deg);box-shadow:0 8px 0 rgba(0,0,0,.3);font:600 15px var(--body);line-height:1.5;max-height:calc(100vh - 110px);overflow:auto}
.intro .letter p{margin:0 0 6px}
.intro .letter .sig{text-align:right;font-family:var(--display)}
.intro .skip{color:var(--ink);position:absolute;top:calc(10px + var(--st));right:calc(12px + var(--sr))}
.intro .tapnext{font:600 12px var(--display);color:rgba(255,250,241,.6)}

/* Character creation */
.create{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.create .preview{background:#bfe7f7;border:2px solid var(--ink);border-radius:16px;aspect-ratio:3/4;overflow:hidden}
.create .preview canvas{width:100%;height:100%}
.create label{display:block;font:600 12px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:6px 0 3px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--yellow)}
.swatches .txt{width:auto;border-radius:999px;padding:0 10px;font:600 12px var(--display);background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Report card */
.report h2{display:flex;align-items:center;gap:10px}
.report h2 span{flex:1}
.grade{font:700 34px var(--display);width:56px;height:56px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);color:#fff}
.report .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.report table{width:100%;border-collapse:collapse;font-size:14px}
.report td{padding:2px 0}
.report td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.report tr.total td{border-top:2px solid var(--ink);font:700 16px var(--display);padding-top:4px}
.report .note{font-size:12px;color:var(--ink2);line-height:1.35;margin:2px 0 0}
.report .foot{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.report .xp{display:flex;align-items:center;gap:8px;font:600 13px var(--display)}
.report .xp .bar{flex:1;height:10px;border-radius:5px}
.report .levelup{margin:2px 0 8px;background:#fff1c2;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:13px;box-shadow:0 3px 0 rgba(61,43,53,.25)}
.report .lv-title{font:700 16px var(--display);margin-bottom:6px}
.unlocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.unlock{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:5px 8px}
.unlock canvas{width:36px;height:36px;flex:none;border-radius:8px;background:var(--paper)}
.unlock b{display:block;font:600 14px var(--display)}
.unlock span{display:block;font-size:12px;color:var(--ink2);line-height:1.3}
.btn.danger{background:#fde2e6;color:#b3263e}
.dialog.top{bottom:auto;top:calc(56px + var(--st));right:auto;margin:0;max-width:min(470px,48vw)}
.pulse{outline:3px solid var(--yellow);outline-offset:3px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{outline-offset:7px;outline-color:rgba(255,210,63,.35)}}
.report .actions{display:flex;justify-content:flex-end;margin-top:8px;position:sticky;bottom:-14px;background:var(--cream);padding:6px 0 12px;margin-bottom:-12px}
.settings .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font:600 15px var(--display)}
.settings .row small{display:block;font:400 12px var(--body);color:var(--ink2)}
.settings .set-cols{display:grid;grid-template-columns:1fr;gap:4px 22px}
@media (min-width:600px){.settings .set-cols{grid-template-columns:1fr 1fr}}
.settings .row.slider span:first-child{flex:none;width:104px}
.settings .row.slider .val{flex:none;width:40px;text-align:right;font-size:13px;color:var(--ink2)}
.settings input[type=range]{flex:1;min-width:0;accent-color:var(--pink);height:28px;touch-action:pan-x}
.settings textarea{width:100%;font:12px ui-monospace,monospace;border:2px solid var(--ink);border-radius:10px;padding:8px;background:#fff;color:var(--ink);resize:none;-webkit-user-select:text;user-select:text;touch-action:auto;word-break:break-all}
.settings .btn{white-space:nowrap}
.settings .btn:disabled{opacity:.45}
.toggle{width:52px;height:30px;border-radius:999px;border:2px solid var(--ink);background:#eadfcb;position:relative;padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--green)}
.toggle[aria-pressed="true"]::after{left:24px}
.notebook .entry{border-bottom:1px dashed var(--line);padding:6px 0}
.notebook .entry b{font-family:var(--display)}

#rotate{display:none;position:absolute;inset:0;background:var(--plum);color:var(--cream);place-items:center;text-align:center;font:600 18px var(--display);z-index:10}
.rotate-phone{width:46px;height:78px;border:4px solid var(--cream);border-radius:10px;margin:0 auto 14px;animation:turn 2s infinite ease-in-out}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation: portrait) and (pointer: coarse){ #rotate{display:grid} }
@media (max-height: 380px){
  .round{width:42px;height:42px}
  .tool{width:56px}
  .dialog .face{width:62px;height:62px}
  .dialog .line{font-size:14px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* Layering: cards and panels < tips < Gus < modals < toasts */
.card,.panel,.night-bar,.day-ctl{z-index:5}
.tip{z-index:6}
.dialog{z-index:10}
.modal{z-index:20}
.toast{z-index:30}
.item .have{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:#ffe8a3;border:1.5px solid var(--ink);font:600 11px var(--display);vertical-align:2px}
.staff-row .dream{color:#c2185b;font-weight:700}
.staff-row .info select{display:block;margin-top:4px;max-width:100%}

.ios-tip{position:absolute;left:50%;top:calc(8px + var(--st));transform:translateX(-50%);width:min(460px,calc(100% - 24px));background:var(--cream);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:7px 12px;z-index:20;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.ios-tip b{font:700 15px var(--display)}
.ios-tip p{grid-column:1;margin:0;font-size:12.5px;line-height:1.3}
.ios-tip .btn{grid-column:2;grid-row:1 / span 2}
tr.neg td:last-child{color:var(--red)}

/* ---------- Mall Market (the Build menu): a full-screen shop with big cards ---------- */
.panel.market{z-index:8;left:calc(8px + var(--sl));width:auto;border-width:3px;border-radius:22px;
  background:radial-gradient(circle at 20% 0%,#fff 0,transparent 40%),repeating-linear-gradient(45deg,#fff5e4 0 14px,#fdf0da 14px 28px)}
.panel.market header{padding:10px 14px 6px;gap:10px}
.panel.market header h2{flex:none;font-size:22px;letter-spacing:.01em;margin-right:6px}
.panel.market header .tabs{flex:1;padding:0;justify-content:flex-start}
.panel.market header .x{width:36px;height:36px}
.mk-money{margin-left:auto;font:700 15px var(--display);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 12px}
.panel.market .tabs{gap:6px}
.panel.market .tabs button{flex:0 0 auto;padding:5px 16px;font-size:14px}
.panel .body.mk-body{overflow:hidden;padding:0 0 10px;gap:6px}
.mk-shelves{display:flex;align-items:center;gap:6px;padding:0 14px;overflow-x:auto;scrollbar-width:none;flex:none;touch-action:pan-x}
.mk-shelves::-webkit-scrollbar{display:none}
.mk-shelf{--c:var(--ink);flex:none;font:600 13px var(--display);border:2px solid var(--c);color:var(--ink);background:#fff;border-radius:10px;padding:3px 12px;display:flex;align-items:center;gap:5px}
.mk-shelf[aria-selected="true"]{background:var(--c);color:#fff;border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.mk-count{background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:18px;padding:0 5px;line-height:17px;text-align:center}
.mk-hint{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap;padding-left:8px}
.mk-row{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:minmax(0,1fr);gap:12px;overflow-x:auto;overflow-y:hidden;padding:4px 14px 6px;touch-action:pan-x;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:thin}
@media (min-height:600px){.mk-row{grid-template-rows:repeat(2,minmax(0,1fr))}}
.mk-empty{flex:1;display:flex;align-items:center;justify-content:center;font:600 15px var(--display);color:var(--ink2);padding:20px;text-align:center}
.mk-card{--c:#3fb8af;scroll-snap-align:start;display:flex;flex-direction:column;min-height:0;padding:0;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 4px 0 rgba(61,43,53,.35);font:inherit;color:inherit;transition:transform .08s}
.mk-card:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 rgba(61,43,53,.35)}
.mk-art{position:relative;flex:none;height:clamp(76px,27vh,132px);display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--ink);background:var(--c);
  background:radial-gradient(circle,rgba(255,255,255,.75) 0 30%,transparent 62%),repeating-conic-gradient(from 0deg,var(--c) 0 12deg,color-mix(in srgb,var(--c) 78%,#fff) 12deg 24deg)}
.mk-art canvas{width:78px;height:78px;filter:drop-shadow(0 3px 0 rgba(61,43,53,.25))}
.mk-kind{position:absolute;left:7px;top:7px;font:600 10.5px var(--display);text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.92);border:1.5px solid var(--ink);border-radius:999px;padding:1px 7px}
.mk-new,.mk-have{position:absolute;right:7px;top:7px;font:700 11px var(--display);border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px}
.mk-new{background:var(--red);color:#fff;text-transform:uppercase;transform:rotate(4deg)}
.mk-have{background:#ffe8a3}
.mk-text{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;padding:6px 9px 4px}
.mk-name{font:700 15px var(--display);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-blurb{font-size:12px;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mk-stats{font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-buy{flex:none;margin:4px 8px 8px;border:2px solid var(--ink);border-radius:12px;padding:5px 6px;text-align:center;font:700 15px var(--display);background:var(--green);color:#fff;box-shadow:0 3px 0 var(--ink)}
.mk-card.short .mk-buy{background:#fff;color:var(--red)}
.mk-card.owned .mk-buy{background:var(--paper);color:var(--ink2);box-shadow:none}
.mk-card.locked{filter:saturate(.25);opacity:.75}
.mk-card.locked .mk-buy{background:var(--ink);color:var(--cream);font-size:13px;box-shadow:none}
.mk-lock{display:inline-block;margin-right:6px;vertical-align:-1px}
@media (max-height:440px){.mk-art canvas{width:66px;height:66px}.panel.market header{padding:8px 12px 4px}.panel.market header h2{font-size:19px}.mk-buy{padding:4px 6px;font-size:14px}}
.mk-seg{flex:none;display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.mk-segbtn{font:600 13px var(--display);border:0;background:transparent;padding:4px 11px;color:var(--ink);white-space:nowrap}
.mk-segbtn + .mk-segbtn{border-left:2px solid var(--ink)}
.mk-segbtn[aria-selected="true"]{background:var(--ink);color:var(--cream)}
.mk-div{flex:none;width:2px;align-self:stretch;margin:2px 2px;background:var(--line);border-radius:2px}
.mk-cats{display:flex;gap:6px;flex:none}
.mk-sep{grid-row:1/-1;width:30px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:color-mix(in srgb,var(--c) 22%,transparent);border:2px dashed var(--c);scroll-snap-align:start}
.mk-sep span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 13px var(--display);color:var(--ink);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.mk-row{grid-auto-columns:auto}
.mk-card{width:176px}

/* ---------- Staff Room (full-screen, like the Mall Market) ---------- */
.sr-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sr-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin-bottom:8px}
.sr-tile{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 rgba(61,43,53,.3);display:flex;flex-direction:column;line-height:1.15}
.sr-tile b{font:700 22px var(--display)}

.sr-tile.bad b{color:#c2183f}
.sr-cols{display:grid;grid-template-columns:1fr;gap:4px 16px}

.sr-alert{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fff;border:2px solid var(--line);border-left:7px solid var(--teal);border-radius:12px;padding:7px 10px;font-size:13px;line-height:1.35}
.sr-alert.bad{border-left-color:var(--red);background:#fff4f6}
.sr-alert.warn{border-left-color:#ff9f43;background:#fff8ec}
.sr-alert.good{border-left-color:var(--green);background:#effaf3;font:600 13.5px var(--display)}
.sr-alert .btn{flex:none;white-space:nowrap}
.sr-roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}

.sr-role small{font-size:11px;color:var(--ink2)}

.sr-role .bar i{display:block;height:100%;background:var(--green)}

.sr-reg{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:5px 8px}
.sr-reg.bad{border-color:var(--red);background:#fff4f6}

.sr-reg .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sr-reg b{font:600 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-reg b small{color:var(--ink2);font-size:11px}
.sr-reg select,.sr-card select{font:600 12px var(--body);border:2px solid var(--ink);border-radius:8px;padding:2px 4px;background:#fff;max-width:100%;color:var(--ink)}

.sr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.sr-card{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:7px 10px;box-shadow:0 3px 0 rgba(61,43,53,.3)}
.sr-card.warn{border-color:#ff9f43}
.sr-card canvas{width:52px;height:52px;flex:none;border-radius:12px;background:var(--paper)}
.sr-card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sr-card b{font:700 15px var(--display)}
.sr-card small{font-size:12px;color:var(--ink2)}

.sr-card select{width:100%}
.sr-card .open-now{display:inline-block;margin-left:4px;background:var(--red);color:#fff;border-radius:999px;padding:0 6px;font:700 10.5px var(--display)}
.sr-foot{flex:none;margin:0;padding:0 14px;font-size:11.5px;color:var(--ink2)}

 it up.",done:["That\u2019s the whole job: keep folks served and keep the floors clean.","I\u2019ll get out of your hair. See you around. Don\u2019t let the pigeons win."]},z0={night1:{title:"Why Gus still comes by",lines:["You did all right today. Rose would\u2019ve been tickled.","You\u2019re probably wondering why an old man walks laps in a closed mall.","Habit, mostly. Twenty-seven years, my day started right here. Marlene and I ate lunch on that fountain every single day.","When the last big store left in 2016, your grandma had to let us all go. I was the last one. She told me to keep my keys.","Anyway. Here. My old notebook. Every trick I learned keeping this place running is in there."],reward:"Gus gave you his notebook. Tips will show up in it as you need them."},dee:{title:"A good word",lines:["Evening! Saw the lights on, figured I\u2019d stop in.","Place is getting busy. You need a real janitor, and my knees aren\u2019t what they were.","There\u2019s a gal named Dee. I trained her back in \u201904. Best mop hand I ever saw.","Let me show you where to find her."],reward:""},fountain:{title:"One more good day",lines:["Would you look at that. Water in the old girl again.","Rose tossed a penny in every morning. Said it bought her one more good day.","Marlene and I would sit right on the edge with our pretzels. Twenty years.","You should keep that up. The penny, I mean."],reward:"Each morning, tap the coin over the fountain to make a wish for the day."},arcade:{title:"High score",lines:["An arcade! I held the high score on Galaxy Pals from 1994 until the day they hauled it out.","G-U-S. Three letters of pure glory.","Don\u2019t tell the teenagers. They\u2019ll want to beat it."],reward:""}},Yf={east:["Evening, boss. Had to come see it for myself. Full stores, music playing, kids running around.","You know there\u2019s a whole second floor up there? Busiest part of the mall when I started. Rose shut the escalator off in \u201909 to save on the heating bill.","With the kind of money you\u2019re pulling in, you could open her back up. Twenty grand, give or take. Get that old escalator running and there\u2019s room for big shops up top.","Take a look under Build, then Fix up. Rose would\u2019ve cried happy tears."],garden:["That second floor\u2019s humming. Better than I ever saw it.","Rose had one dream she never got to. A garden up there, under a glass roof. Real trees, sunlight, somewhere to sit that doesn\u2019t smell like pretzels.","The far end of the second floor is still boarded up. Forty-five grand and it\u2019s yours. Just saying."],casino:["Evening, boss. I took the long way in tonight. Every floor, every store. Had to sit down by the fountain for a minute.","When Rose and I locked those doors, I figured that was it. Pigeons and dust, forever. Now look. Two floors, every storefront lit, a line at the door every morning.","She\u2019d be proud of you. I mean that.","Now, here\u2019s a wild one. There\u2019s a third floor up top. Used to be the Starlight Ballroom: big band on Fridays, the whole town in their good shoes.","Some folks I know want to bring it back as a casino. Bright lights, card tables, slot machines going ding-ding-ding. Fifty grand, and you\u2019ve got it sitting right there.","You\u2019d need dealers to run the tables. Real pros, vests and bow ties. Look under Build, then Fix up. Rose always did love a little razzle-dazzle."],vip:["Boss, that casino of yours is the talk of the town. I saw a fellow in a gold tie tip a dealer fifty bucks.","Folks with that kind of money want somewhere quieter to play. A high roller suite at the end of the casino floor: gold carpet, golden slots, champagne.","A hundred and twenty grand. Big number. Bigger crowd. Your call."]},Mo={lines:["One more thing before I head out.","You can\u2019t be at every register at once. Back in the day there was a clerk behind every counter.","I asked around, and a couple of folks would be glad of the work. Let me show you where to hire them."],staff:"Tap Staff, down in the corner. That\u2019s where you hire help.",hire:"Hire two clerks. Each one takes a register for you.",hired:["There you go. They\u2019ll be behind the registers when you open tomorrow.","That frees you up to keep the floors clean and plan what\u2019s next. Wages come out each night."],skipped:["Suit yourself. Clerks are under Staff whenever you want them."]},Kf=["Evening! Registers ran smooth today, didn\u2019t they?","Now that you\u2019ve got help, let\u2019s get another shop open. Those boarded-up storefronts won\u2019t fix themselves.","Tap Build and pick a store. I\u2019d start with something small and sweet."],Vf=["Evening, boss. You see those kids today? Blasting music, kicking over trash cans, scaring off customers.","Busy malls draw a rowdy crowd. Always have. Back in \u201998 we had a whole gang that lived in the arcade.","You can tap one to shoo them out yourself. But a place this size needs real security.","Hire a security guard under Staff. They\u2019ll walk the halls and show troublemakers the door."],ra={staff:"Tap Staff, down in the corner. That\u2019s where you hire help.",hire:"There\u2019s Dee, right at the top. Tap Hire.",hired:["That\u2019s her. She\u2019ll be here when you open tomorrow.","Wages come out each night. When things get busier, come back here and hire more help."],skipped:["No rush. Dee\u2019s name will be on that list whenever you\u2019re ready."]},wo={night:{title:"Nights are for building",text:"Nothing\u2019s on the clock till you hit Open Doors. Tap things in the mall to see what you can do."},open:{title:"Opening a store",text:"Those boarded-up storefronts can be shops again. Tap Build, pick a store, then tap a glowing storefront to open it."},newshell:{title:"Out of storefronts",text:"Every storefront\u2019s taken. Pick a store under Build and tap Build new to put one up. Old storage gets cleared out as part of the job."},walkout:{title:"Folks don\u2019t wait forever",text:"If customers wait in line too long they get frustrated and leave (that\u2019s the little storm cloud). Watch the ring around their bubble: tap it to rush to that register before it runs out, or hire clerks to keep the lines moving."},wish:{title:"Grey bubbles",text:"Grey means we don\u2019t have what they want. The report card keeps a list of what folks wished for."},style:{title:"A fresh look",text:"The old lilac walls have had a good run. Under Build, then Style, you can pick new wallpaper and flooring for the whole mall. A fresh look brightens the ambience, too."},litter:{title:"Trash cans",text:"Put a trash can out and most folks nearby will toss their trash in it instead of on the floor. Build, then Decor."},staff:{title:"Hiring help",text:"You can hire staff now. Open Staff at night. Janitors sweep, clerks run a register for you."},clerks:{title:"Clerks",text:"Clerks can run a register for you now. Hire one under Staff and pick their store. Put them in their dream job (\u2665) and folks spend more."},speed:{title:"Speed things up",text:"Got help now? Tap the fast-forward button to speed up the day."},fountain:{title:"The old fountain",text:"That fountain was the heart of this place. Fix it up and folks will stop to sit a while."},stockout:{title:"Empty shelves",text:"A store ran out today. Shelves restock overnight, so keep a little cash on hand."},register:{title:"Back to the register",text:"You can tap any store to go stand at its register. You\u2019ll serve whoever lines up until you leave."},move:{title:"Rearranging",text:"Moving things at night is free. Tap a store or decoration, then Move."},slacker:{title:"On their phone again",text:"One-star hires take long phone breaks. Tap the phone bubble and you\u2019ll go have a word. Two-stars slack off now and then; three-stars never do."},restroom:{title:"Restrooms",text:"Folks need the restroom too, and it gets grubby. Tap it to mop it out yourself, or hire janitors: they\u2019ll keep it clean."}};var u0=document.getElementById(
